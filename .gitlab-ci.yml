# ============================================================================
# 前端独立流水线（本仓库 = 前端项目根）
#
#   MR / develop / main → check   ：vue-tsc 类型检查 + 构建验证
#   develop 合入        → package ：打 nginx 镜像（MODE=test）推 Registry → 自动部署【测试】
#   main 合入           → deploy:staging：手动确认 → 部署【预发】（MODE=staging）
#
# 前置准备（Runner/Registry/服务器/.env/变量）见 docs/ci-cd.md
# ============================================================================

stages:
  - check
  - package
  - deploy

workflow:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'develop'"
    - if: "$CI_COMMIT_BRANCH == 'main'"
    - if: "$CI_COMMIT_BRANCH == 'master'"

variables:
  GIT_DEPTH: "5"

default:
  interruptible: true

# ────────────────────────── 检查 ──────────────────────────
check:
  stage: check
  image: node:20
  before_script:
    - corepack enable
  cache:
    key: frontend-pnpm
    paths:
      - .pnpm-store
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec vue-tsc --noEmit
    - pnpm exec vite build --mode test

# ────────────────────────── 打镜像 ──────────────────────────
# develop → MODE=test（读 .env.test）；main → MODE=staging（读 .env.staging）
package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"
      variables:
        FRONTEND_MODE: test
    - if: "$CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'master'"
      variables:
        FRONTEND_MODE: staging
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build --build-arg MODE=$FRONTEND_MODE -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# ────────────────────────── 部署 ──────────────────────────
# 不写 needs，按 stage 顺序：check 不过 → 不打镜像 → 不部署
.deploy_tpl:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client curl
    - eval "$(ssh-agent -s)"
    - echo "$SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_DIR"
    - scp docker-compose.deploy.yml $SSH_USER@$SSH_HOST:$DEPLOY_DIR/
    - |
      ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && \
        IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        docker compose -f docker-compose.deploy.yml pull web && \
        IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        docker compose -f docker-compose.deploy.yml up -d --remove-orphans"
    # 健康检查（最多 ~40s）：首页 200 即认为前端容器活着
    - |
      ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && [ -f .env ] && . ./.env; \
        for i in \$(seq 1 20); do \
          if curl -sf http://127.0.0.1:\${WEB_PORT:-80}/ >/dev/null 2>&1; then echo '✅ healthy'; exit 0; fi; \
          sleep 2; \
        done; \
        echo '❌ health check failed'; docker logs --tail 30 admin-web; exit 1"

deploy:test:
  extends: .deploy_tpl
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"
  variables:
    SSH_HOST: $TEST_SSH_HOST
    SSH_USER: $TEST_SSH_USER
    SSH_KEY: $TEST_SSH_KEY
    DEPLOY_DIR: $TEST_DEPLOY_DIR

deploy:staging:
  extends: .deploy_tpl
  rules:
    - if: "$CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'master'"
      when: manual # 预发要人工确认（发布卡点）
  variables:
    SSH_HOST: $STAGING_SSH_HOST
    SSH_USER: $STAGING_SSH_USER
    SSH_KEY: $STAGING_SSH_KEY
    DEPLOY_DIR: $STAGING_DEPLOY_DIR
